<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>八幡組｜YAHATA-GUMI ARCHIVES</title>

  <!-- Google Fonts: Noto Serif JP & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              DEFAULT: '#0B1013',
              light: '#121A1F',
              lighter: '#182229',
              card: '#0E1418'
            },
            gold: {
              DEFAULT: '#967249',
              light: '#B38E63',
              dark: '#6E5233',
              muted: 'rgba(150, 114, 73, 0.28)'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif JP"', '"Noto Serif TC"', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-ink: #0B1013;
      --accent-gold: #967249;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B1013;
      color: #E5E0D8;
      font-family: "Noto Serif JP", "Noto Serif TC", serif;
      overflow-x: hidden;
    }

    .washi-bg {
      background-color: #0B1013;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(150, 114, 73, 0.06) 0%, transparent 60%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    .shoji-door {
      transition: transform 1.45s cubic-bezier(0.77, 0, 0.175, 1);
      will-change: transform;
    }

    .shoji-washi-surface {
      background-color: #0F1519;
      background-image:
        radial-gradient(circle at center, rgba(150, 114, 73, 0.07) 0%, rgba(11, 16, 19, 0.85) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 24px
        );
    }

    .shoji-grid {
      background-image:
        linear-gradient(to right, #06090B 3px, transparent 3px),
        linear-gradient(to bottom, #06090B 3px, transparent 3px);
      background-size: 25% 16.666%;
    }

    .shoji-open-left {
      transform: translateX(-100%);
    }

    .shoji-open-right {
      transform: translateX(100%);
    }

    #page-curtain {
      background-color: #0B1013;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide-item {
      transition: opacity 1.2s ease-in-out, transform 6.5s ease-out;
    }

    .slide-active {
      opacity: 1;
      transform: scale(1.04);
    }

    .slide-inactive {
      opacity: 0;
      transform: scale(1);
    }

    .writing-vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    .bubble-node {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .bubble-node:hover {
      transform: translate(-50%, -50%) scale(1.06);
    }

    .bubble-center {
      box-shadow: 0 0 28px rgba(150, 114, 73, 0.28), inset 0 0 14px rgba(150, 114, 73, 0.14);
    }

    .avatar-btn-active {
      border-color: #967249 !important;
      box-shadow: 0 0 18px rgba(150, 114, 73, 0.35);
      background-color: rgba(150, 114, 73, 0.12);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0B1013;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 114, 73, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #967249;
    }
  </style>
</head>
<body class="bg-ink text-[#E5E0D8] antialiased selection:bg-gold selection:text-ink">

  <div
    id="page-curtain"
    aria-hidden="true"
    class="fixed inset-0 z-[90] bg-ink opacity-0 pointer-events-none"
  ></div>

  <!-- =========================================================================
       第一頁：首頁入口 (#page-home)
       ========================================================================= -->
  <main id="page-home" class="relative w-full min-h-[100dvh] flex flex-col lg:flex-row overflow-hidden bg-ink">

    <div id="shoji-overlay" class="fixed inset-0 z-50 flex pointer-events-none overflow-hidden">
      <div
        id="shoji-left"
        class="shoji-door w-1/2 h-full shoji-washi-surface relative border-r-[3px] border-[#06090B] shadow-2xl"
      >
        <div class="absolute inset-0 shoji-grid opacity-90"></div>
        <div class="absolute inset-y-4 right-3 w-[1px] bg-gold/25"></div>
      </div>

      <div
        id="shoji-right"
        class="shoji-door w-1/2 h-full shoji-washi-surface relative border-l-[3px] border-[#06090B] shadow-2xl"
      >
        <div class="absolute inset-0 shoji-grid opacity-90"></div>
        <div class="absolute inset-y-4 left-3 w-[1px] bg-gold/25"></div>
      </div>
    </div>

    <button
      id="replay-shoji-btn"
      type="button"
      aria-label="障子開閉"
      class="fixed top-4 right-4 sm:top-6 sm:right-6 z-40 px-3.5 py-1.5 text-[11px] sm:text-xs tracking-[0.25em] text-gold/90 bg-ink/80 backdrop-blur-sm border border-gold/45 rounded hover:bg-gold/15 hover:border-gold transition-all duration-300 cursor-pointer"
    >
      障子開閉
    </button>

    <section
      id="hero-slideshow"
      aria-label="橫濱街景氛圍輪播"
      class="relative w-full lg:w-1/2 h-[48dvh] lg:h-[100dvh] overflow-hidden bg-[#070A0C] select-none"
    >
      <div id="slides-container" class="relative w-full h-full">
        <div class="slide-item slide-active absolute inset-0" data-slide="0">
          <img
            src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1400&q=80"
            alt="橫濱港未來夜色"
            class="w-full h-full object-cover brightness-[0.55] contrast-[1.12] saturate-[0.75]"
            onerror="this.style.display='none'"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-ink/50 via-transparent to-ink"></div>
        </div>

        <div class="slide-item slide-inactive absolute inset-0" data-slide="1">
          <img
            src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1400&q=80"
            alt="橫濱雨夜街巷"
            class="w-full h-full object-cover brightness-[0.52] contrast-[1.15] saturate-[0.7]"
            onerror="this.style.display='none'"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-ink/50 via-transparent to-ink"></div>
        </div>

        <div class="slide-item slide-inactive absolute inset-0" data-slide="2">
          <img
            src="https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?auto=format&fit=crop&w=1400&q=80"
            alt="橫濱港灣燈影"
            class="w-full h-full object-cover brightness-[0.52] contrast-[1.12] saturate-[0.7]"
            onerror="this.style.display='none'"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-ink/50 via-transparent to-ink"></div>
        </div>

        <div class="slide-item slide-inactive absolute inset-0" data-slide="3">
          <img
            src="https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=1400&q=80"
            alt="橫濱深夜靜謐"
            class="w-full h-full object-cover brightness-[0.5] contrast-[1.15] saturate-[0.65]"
            onerror="this.style.display='none'"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-ink/50 via-transparent to-ink"></div>
        </div>
      </div>

      <div class="hidden lg:block absolute inset-y-0 right-0 w-24 bg-gradient-to-l from-ink to-transparent pointer-events-none"></div>
      <div class="lg:hidden absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-ink to-transparent pointer-events-none"></div>

      <div class="absolute top-5 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2">
        <button type="button" class="slide-dot w-7 h-[2px] bg-gold transition-all duration-300" data-index="0" aria-label="第 1 張"></button>
        <button type="button" class="slide-dot w-7 h-[2px] bg-gold/30 transition-all duration-300" data-index="1" aria-label="第 2 張"></button>
        <button type="button" class="slide-dot w-7 h-[2px] bg-gold/30 transition-all duration-300" data-index="2" aria-label="第 3 張"></button>
        <button type="button" class="slide-dot w-7 h-[2px] bg-gold/30 transition-all duration-300" data-index="3" aria-label="第 4 張"></button>
      </div>

      <div class="absolute top-6 left-5 sm:top-8 sm:left-8 z-20 flex items-start gap-2.5 pointer-events-none">
        <span class="w-[1px] h-16 bg-gold/55 mt-1"></span>
        <p class="writing-vertical text-[11px] sm:text-xs tracking-[0.35em] text-[#D8D1C5]/80 font-light">
          横浜・みなとみらい
        </p>
      </div>
    </section>

    <div class="relative z-20 flex items-center justify-center lg:hidden -mt-2 mb-1">
      <div class="w-full h-[1px] bg-gold/25"></div>
      <div class="absolute w-3 h-3 rotate-45 border border-gold/60 bg-ink"></div>
    </div>

    <section class="relative w-full lg:w-1/2 flex-1 lg:h-[100dvh] bg-ink flex flex-col items-center justify-between px-6 py-6 sm:py-10 lg:py-14 lg:border-l lg:border-gold/15">

      <div class="hidden lg:flex flex-col items-center gap-2 pt-4">
        <span class="text-[11px] tracking-[0.45em] text-gold/75 uppercase">YAHATA-GUMI</span>
        <div class="w-10 h-[1px] bg-gold/35"></div>
      </div>

      <div class="w-full max-w-[240px] sm:max-w-[290px] lg:max-w-[330px] aspect-square my-auto flex flex-col items-center justify-center relative select-none">
        <img
          id="emblem-img"
          src="./dai.png"
          alt="八幡組家紋"
          class="w-full h-full object-contain mix-blend-lighten contrast-[1.05]"
        />
        <p id="emblem-error-hint" class="hidden text-xs tracking-[0.15em] text-gold/80 text-center px-4">
          找不到圖檔（請確認 GitHub 專案根目錄是否有小寫檔名的 dai.png）
        </p>
      </div>

      <div class="w-full max-w-[280px] sm:max-w-[320px] flex flex-col items-center gap-4 pt-3">
        <button
          id="enter-archive-btn"
          type="button"
          style="letter-spacing: 0.45em; padding-left: 0.45em;"
          class="w-full h-12 sm:h-13 bg-gold hover:bg-gold-light active:scale-[0.99] text-ink font-semibold text-sm sm:text-base rounded flex items-center justify-center transition-all duration-300 shadow-[0_8px_24px_rgba(150,114,73,0.22)] cursor-pointer"
        >
          入場
        </button>

        <p class="text-[10px] sm:text-[11px] tracking-[0
